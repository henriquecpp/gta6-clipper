# Copy to config.yaml (mounted read-only in the app container).
# Durations use Go syntax (30s, 5m, 6h). Sizes accept KiB/MiB/GiB.

streamers:
  - login: exemplo_streamer
    language: en
    allows_clips: true
    # auto: finds the facecam in every clip (stack layout when found; follows the camera
    # if the streamer moves it) | blur | stack (fixed regions below) | crop
    layout: auto
    # Fixed regions for stack, or the fallback of auto when a clip has no clear camera:
    # stack: { facecam: [0.70, 0.00, 0.30, 0.30], gameplay: [0.0, 0.0, 1.0, 1.0] }
    offsets: { capture_latency: 4s, chat: 8s, clip: 5s }

twitch:
  # Only lives in these categories are monitored (Twitch name, case-insensitive, or id).
  # 1867279146 = Grand Theft Auto VI. An empty list ([]) monitors every game.
  games: ["Grand Theft Auto VI"]
  live_poll_interval: 45s
  capture_quality: 720p60
  token_file: /data/twitch_user_token.json

capture:
  buffer_dir: /buffer
  pending_dir: /pending
  buffer_duration: 10m
  buffer_max_bytes: 4GiB
  segment_duration: 2s

approval:
  ttl: 6h

concurrency:
  max_streams: 8
  ffmpeg_workers: 4
  ffmpeg_threads_per_job: 4
  transcribe_workers: 1
  render_workers: 1

render:
  output_dir: /output
  width: 1080
  height: 1920
  fps: 30
  encoder: h264_nvenc       # automatic fallback to libx264
  min_duration: 15s
  max_duration: 60s
  max_file_bytes: 45MiB
  preview_height: 854       # vertical preview (480x854), same layout as the final video
  preview_duration: 40s
  preview_before: 25s       # part of the preview before the peak; the rest shows the reaction
  font: Noto Sans
  max_line_chars: 28
  headline_max_chars: 60

whisper:
  url: http://whisper:8080
  timeout: 5m
  beam_size: 5              # beam search: more accurate than greedy, a few seconds more on the GPU
  # Speech is transcribed in each streamer's `language` (auto-detection looks only at the
  # first 30 s, and an English cutscene there turned Portuguese speech into made-up English).
  # Streamers who speak another language get a second pass in the game's language, so the
  # editor can tell cutscene/NPC dialogue apart from the streamer. "" disables it.
  game_language: en

editor:
  max_tokens: 16000         # thinking counts toward it; only generated tokens are paid
  timeout: 90s
  max_cost_per_clip_usd: 0.05
  tool_choice: tool         # tool (forced) | auto (strict tool, for models that reject forced tool_choice)
  peak_tolerance: 5s
  frame_interval: 3s        # still frames of the window shown to the editor (0 disables); ~300 tokens each
  max_frames: 40            # cap; the spacing grows on long windows
  pricing:                  # USD per million tokens (fill with current prices for ANTHROPIC_MODEL)
    input: 0
    output: 0
    cache_write: 0
    cache_read: 0

youtube:                    # publication as Shorts, only when you tap "Publicar no YouTube" (README)
  privacy: public           # public | unlisted | private
  category_id: "20"         # Gaming
  notify_subscribers: true
  made_for_kids: false
  upload_timeout: 15m
  token_file: /data/youtube_token.json
  # {streamer} becomes the login. Few, related hashtags: unrelated ones (or more than 60) get ignored or removed.
  title_hashtags: ["#GTA6", "#Shorts"]                                       # appended to the title while it fits (100 chars)
  hashtags: ["#GTA6", "#GTAVI", "#GrandTheftAutoVI", "#Shorts", "#{streamer}"] # added to the description if missing
  # Most important first; the editor's tags of the moment come before these and the
  # 500-character budget cuts the tail. Tags weigh little in discovery (title and
  # description weigh more), but catch spelling variants.
  tags:
    - "{streamer}"
    - "{streamer} gta 6"
    - GTA 6
    - GTA VI
    - GTA6
    - Grand Theft Auto VI
    - Grand Theft Auto 6
    - GTA 6 gameplay
    - GTA 6 clips
    - GTA 6 shorts
    - GTA 6 momentos engraçados
    - GTA 6 funny moments
    - GTA 6 Brasil
    - GTA 6 PT-BR
    - GTA 6 live
    - Vice City
    - Leonida
    - Rockstar Games
    - clipes da twitch
    - twitch clips
    - melhores momentos

http:
  addr: ":8080"
  shutdown_timeout: 45s

detection:
  tick: 500ms
  warmup: 5m
  cooldown: 60s
  threshold_on: 4.0        # higher = fewer previews (voice and chat must react together)
  threshold_off: 1.5
  min_signal_z: 3.5        # voice or chat must reach this z (also gates clip rains)
  z_max: 6.0
  pre_roll: 60s
  post_roll: 30s
  weights: { voice: 0.45, chat: 0.45, clips: 0.10 }
  voice:
    frame: 30ms
    window: 400ms
    ewma_alpha: 0.01
    stale_after: 2s
  chat:
    window: 10s
    sustain: 4s
    ewma_alpha: 0.02
    emotes:
      en: { KEKW: 2.0, LUL: 1.5, OMEGALUL: 2.5, LMAO: 1.5 }
      pt: { kkkk: 2.0, KKKK: 2.0 }
  clips:
    poll_interval: 30s
    group_window: 15s
    min_clips: 3
    min_z: 4.0               # how far a clip rain must exceed the channel's usual clip rate
  # Your decisions calibrate each streamer: every discard adds step_up to threshold_on,
  # min_signal_z and clips.min_z of that streamer, every approval removes step_down
  # (last 'window' decisions, capped at max_offset; max_offset 0 disables it).
  calibration:
    window: 20
    step_up: 0.25
    step_down: 0.25
    max_offset: 1.5
